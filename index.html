<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Task Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --pink:        #ff1493;
      --pink-dark:   #c2185b;
      --pink-light:  #ff69b4;
      --pink-pale:   #fff0f8;
      --pink-soft:   #ffd6ec;
      --pink-border: #ffb6d9;
      --white:       #ffffff;
      --text:        #1a1a2e;
      --text-muted:  #888;
      --gray:        #f8f4f6;
      --gray2:       #ede8eb;
      --success:     #10b981;
      --danger:      #ef4444;
      --warn:        #f59e0b;
      --radius:      14px;
      --shadow:      0 4px 24px rgba(255,20,147,.13);
      --shadow-lg:   0 12px 48px rgba(255,20,147,.22);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fff0f8 0%, #fff8fc 50%, #ffeef7 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── Decorative blobs ─────────────────────────────────── */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: rgba(255,20,147,.07);
      top: -150px; right: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: rgba(255,105,180,.06);
      bottom: -100px; left: -100px;
    }

    /* ── Pages ────────────────────────────────────────────── */
    .page { display:none; position:relative; z-index:1; }
    .page.active { display:block; }

    /* ══════════════════════════════════════════════
       AUTH PAGE
    ══════════════════════════════════════════════ */
    #auth-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #auth-page.active { display:flex; }

    .auth-card {
      background: var(--white);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%; max-width: 420px;
      box-shadow: var(--shadow-lg);
      animation: rise .5s cubic-bezier(.22,1,.36,1);
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(28px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .auth-icon {
      font-size: 52px; text-align: center;
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-6px); }
    }

    .auth-card h1 {
      text-align: center; font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .auth-card p { text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:28px; }

    .field { margin-bottom: 18px; }
    .field label { display:block; font-weight:700; font-size:13px; margin-bottom:7px; color:var(--text); }
    .field input {
      width:100%; padding:12px 16px;
      border: 2px solid var(--pink-border); border-radius:10px;
      font-family:inherit; font-size:14px; color:var(--text);
      background:#fff; transition:.2s;
    }
    .field input:focus { outline:none; border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,20,147,.1); }
    .field input::placeholder { color:#ccc; }

    .err-box {
      display:none; background:#fde8e8; color:#b91c1c;
      border-left:4px solid var(--danger); border-radius:8px;
      padding:11px 14px; font-size:13px; margin-bottom:16px; font-weight:600;
    }
    .err-box.show { display:block; animation:shake .3s; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25%      { transform:translateX(-6px); }
      75%      { transform:translateX(6px); }
    }

    .btn-main {
      width:100%; padding:14px; border:none; border-radius:12px;
      font-family:inherit; font-size:15px; font-weight:800; cursor:pointer;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color:#fff; letter-spacing:.3px;
      transition: transform .18s, box-shadow .18s;
      box-shadow: 0 6px 20px rgba(255,20,147,.35);
    }
    .btn-main:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 32px rgba(255,20,147,.4); }
    .btn-main:disabled { opacity:.6; cursor:not-allowed; }

    .auth-switch { text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted); }
    .auth-switch button {
      background:none; border:none; color:var(--pink);
      font-weight:800; cursor:pointer; font-family:inherit; font-size:13px;
    }
    .auth-switch button:hover { text-decoration:underline; }

    /* ══════════════════════════════════════════════
       APP PAGE
    ══════════════════════════════════════════════ */
    #app-page { min-height:100vh; padding:20px; }
    #app-page.active { display:block; }

    /* Header */
    .app-header {
      max-width:1180px; margin:0 auto 24px;
      background:var(--white); border-radius:var(--radius);
      padding:16px 28px; box-shadow:var(--shadow);
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo span { font-size:28px; }
    .logo h1 {
      font-size:22px; font-weight:900;
      background:linear-gradient(135deg,var(--pink),var(--pink-dark));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .header-right { display:flex; align-items:center; gap:12px; }
    .user-pill {
      display:flex; align-items:center; gap:10px;
      background:var(--pink-pale); border-radius:30px; padding:7px 14px 7px 7px;
    }
    .avatar {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,var(--pink),var(--pink-dark));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:800; font-size:13px; flex-shrink:0;
    }
    .user-pill strong { font-size:13px; font-weight:800; }
    .user-pill small  { font-size:11px; color:var(--text-muted); display:block; }
    .btn-logout {
      padding:8px 16px; border:2px solid var(--pink-border); border-radius:8px;
      font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
      background:transparent; color:var(--text); transition:.2s;
    }
    .btn-logout:hover { background:var(--pink); color:#fff; border-color:var(--pink); }

    /* Layout */
    .app-body {
      max-width:1180px; margin:0 auto;
      display:grid; grid-template-columns:230px 1fr; gap:20px;
    }

    /* Sidebar */
    .sidebar {
      background:var(--white); border-radius:var(--radius);
      padding:22px 18px; box-shadow:var(--shadow);
      height:fit-content; position:sticky; top:20px;
    }
    .sb-label {
      font-size:10px; font-weight:800; letter-spacing:1.4px;
      text-transform:uppercase; color:#ccc; margin-bottom:10px;
    }
    .sb-btn {
      display:flex; align-items:center; gap:10px; width:100%;
      padding:10px 12px; margin-bottom:5px; border-radius:10px;
      border:2px solid transparent; font-family:inherit;
      font-size:13px; font-weight:700; cursor:pointer;
      background:transparent; color:var(--text); transition:.18s; text-align:left;
    }
    .sb-btn .cnt {
      margin-left:auto; background:var(--pink-soft);
      color:var(--pink); font-size:11px; font-weight:800;
      padding:2px 8px; border-radius:10px; min-width:24px; text-align:center;
    }
    .sb-btn:hover:not(.active) { background:var(--pink-pale); border-color:var(--pink-border); }
    .sb-btn.active {
      background:linear-gradient(135deg,var(--pink),var(--pink-dark));
      color:#fff; border-color:transparent;
    }
    .sb-btn.active .cnt { background:rgba(255,255,255,.25); color:#fff; }

    .sb-divider { border:none; border-top:2px solid var(--pink-soft); margin:18px 0; }

    .stat-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:7px 2px; border-bottom:1px solid var(--gray2); font-size:13px; color:#666;
    }
    .stat-row:last-child { border-bottom:none; }
    .stat-val { font-size:18px; font-weight:900; color:var(--pink); }

    /* Progress bar */
    .prog-wrap { margin-top:14px; }
    .prog-label { font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:700; }
    .prog-bar { background:var(--pink-soft); border-radius:20px; height:8px; overflow:hidden; }
    .prog-fill {
      height:100%; border-radius:20px;
      background:linear-gradient(90deg,var(--pink-light),var(--pink));
      transition: width .5s cubic-bezier(.22,1,.36,1);
    }
    .prog-pct { font-size:12px; color:var(--pink); font-weight:800; text-align:right; margin-top:4px; }

    /* Main panel */
    .main-panel {
      background:var(--white); border-radius:var(--radius);
      padding:28px; box-shadow:var(--shadow);
    }
    .panel-head {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;
    }
    .panel-head h2 { font-size:20px; font-weight:800; }
    .badge-count {
      background:var(--pink-pale); color:var(--pink);
      font-size:12px; font-weight:800; padding:4px 12px; border-radius:20px;
    }

    /* Add task form */
    .add-form {
      background:linear-gradient(135deg,#fff5fb,#fffafd);
      border:2px solid var(--pink-border); border-radius:12px;
      padding:18px; margin-bottom:24px;
    }
    .add-form h3 { font-size:13px; font-weight:800; color:var(--pink); margin-bottom:12px; }
    .form-grid {
      display:grid; grid-template-columns:2fr 1fr 1fr 1fr;
      gap:10px; margin-bottom:10px;
    }
    .fi {
      padding:10px 12px; border:2px solid var(--pink-border);
      border-radius:8px; font-family:inherit; font-size:13px;
      color:var(--text); background:#fff; width:100%; transition:.2s;
    }
    .fi:focus { outline:none; border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,20,147,.08); }
    .form-row2 { display:grid; grid-template-columns:1fr auto; gap:10px; }
    .btn-add {
      padding:10px 24px; border:none; border-radius:8px;
      font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;
      background:linear-gradient(135deg,var(--pink),var(--pink-dark));
      color:#fff; white-space:nowrap; transition:.18s;
    }
    .btn-add:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 18px rgba(255,20,147,.35); }
    .btn-add:disabled { opacity:.5; cursor:not-allowed; }

    /* Task list */
    .task-list { display:flex; flex-direction:column; gap:11px; }

    .task-card {
      background:var(--gray); border-left:4px solid var(--pink);
      border-radius:12px; padding:15px 16px;
      display:flex; align-items:flex-start; gap:13px;
      transition: transform .2s, box-shadow .2s;
      animation: cardIn .3s cubic-bezier(.22,1,.36,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .task-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,20,147,.14); }
    .task-card.done { opacity:.5; border-left-color:#ccc; }
    .task-card.done .tc-title { text-decoration:line-through; color:#aaa; }
    .task-card.p-high   { border-left-color:var(--danger); }
    .task-card.p-medium { border-left-color:var(--pink); }
    .task-card.p-low    { border-left-color:var(--success); }

    /* Checkbox */
    .task-check {
      width:22px; height:22px; border-radius:6px;
      border:2px solid var(--pink-border); cursor:pointer;
      flex-shrink:0; margin-top:2px; display:flex; align-items:center;
      justify-content:center; transition:.2s; background:#fff;
    }
    .task-check:hover { border-color:var(--pink); background:var(--pink-pale); }
    .task-check.checked {
      background:linear-gradient(135deg,var(--pink),var(--pink-dark));
      border-color:var(--pink);
      color:#fff; font-size:13px;
    }

    .tc-body { flex:1; min-width:0; }
    .tc-title { font-size:15px; font-weight:700; margin-bottom:5px; }
    .tc-desc  { font-size:12px; color:var(--text-muted); margin-bottom:8px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tc-tags  { display:flex; gap:7px; flex-wrap:wrap; }
    .tag {
      padding:3px 9px; border-radius:20px;
      font-size:11px; font-weight:700; display:inline-block;
    }
    .tag-high   { background:#fee2e2; color:#b91c1c; }
    .tag-medium { background:#fef3c7; color:#92400e; }
    .tag-low    { background:#d1fae5; color:#065f46; }
    .tag-cat    { background:#e0f2fe; color:#0369a1; }
    .tag-due    { background:#fef9c3; color:#854d0e; }
    .tag-done   { background:#d1fae5; color:#065f46; }

    .tc-actions { display:flex; gap:7px; flex-shrink:0; }
    .act-btn {
      padding:7px 12px; border-radius:7px; font-family:inherit;
      font-size:12px; font-weight:700; cursor:pointer; transition:.18s;
      border:2px solid var(--pink-border); background:#fff; color:var(--text);
    }
    .act-btn:hover       { background:var(--pink); color:#fff; border-color:var(--pink); }
    .act-btn.del:hover   { background:var(--danger); border-color:var(--danger); }
    .act-btn.undone:hover{ background:var(--warn); border-color:var(--warn); }

    /* Empty */
    .empty { text-align:center; padding:60px 20px; color:#ddd; }
    .empty .ei { font-size:56px; margin-bottom:14px; }
    .empty h3 { font-size:18px; color:#bbb; margin-bottom:8px; font-weight:800; }
    .empty p  { font-size:13px; color:#ccc; }

    /* Toast */
    .toast-wrap { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast {
      padding:12px 20px; border-radius:10px; font-size:13px; font-weight:700;
      color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.18);
      animation:toastIn .3s cubic-bezier(.22,1,.36,1);
      min-width:220px; max-width:320px;
    }
    @keyframes toastIn {
      from { opacity:0; transform:translateX(24px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .toast.success { background:var(--success); }
    .toast.error   { background:var(--danger); }
    .toast.info    { background:var(--pink); }

    /* Loading screen */
    #loading-screen {
      position:fixed; inset:0; z-index:9999;
      background:linear-gradient(135deg,var(--pink-pale),#fff5f9);
      display:flex; align-items:center; justify-content:center;
      font-size:36px; transition:opacity .3s;
    }
    #loading-screen.hide { opacity:0; pointer-events:none; }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width:900px) {
      .app-body { grid-template-columns:1fr; }
      .sidebar  { position:static; }
    }
    @media (max-width:700px) {
      .app-header { flex-wrap:wrap; gap:10px; padding:14px 16px; }
      .form-grid  { grid-template-columns:1fr 1fr; }
      .task-card  { flex-wrap:wrap; }
      .tc-actions { width:100%; justify-content:flex-end; }
    }
    @media (max-width:480px) {
      #app-page  { padding:12px; }
      .main-panel{ padding:16px; }
      .form-grid  { grid-template-columns:1fr; }
      .form-row2  { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- ── Loading ───────────────────────────────────────────── -->
<div id="loading-screen">⏳</div>

<!-- ══════════════════════════════════════════════
     AUTH PAGE
══════════════════════════════════════════════ -->
<div id="auth-page" class="page">
  <div class="auth-card">
    <div class="auth-icon" id="auth-icon">📋</div>
    <h1 id="auth-title">Welcome Back</h1>
    <p id="auth-sub">Sign in to manage your tasks</p>

    <div class="err-box" id="auth-err"></div>

    <div class="field" id="field-name" style="display:none">
      <label>Full Name</label>
      <input type="text" id="inp-name" placeholder="John Doe" />
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="inp-email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="inp-pass" placeholder="Min. 6 characters" />
    </div>

    <button class="btn-main" id="auth-btn" onclick="submitAuth()">🔓 Login</button>

    <div class="auth-switch">
      <span id="switch-txt">Don't have an account?</span>
      <button onclick="toggleMode()">Register here</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     APP PAGE
══════════════════════════════════════════════ -->
<div id="app-page" class="page">

  <!-- Header -->
  <header class="app-header">
    <div class="logo"><span>📋</span><h1>Task Manager</h1></div>
    <div class="header-right">
      <div class="user-pill">
        <div class="avatar" id="user-avatar">?</div>
        <div>
          <strong id="user-name">User</strong>
          <small id="user-email">email</small>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Body -->
  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-label">Filters</div>
      <button class="sb-btn active" id="f-all"       onclick="setFilter('all')">       📌 All Tasks     <span class="cnt" id="c-all">0</span></button>
      <button class="sb-btn"        id="f-pending"   onclick="setFilter('pending')">   ⏳ Pending        <span class="cnt" id="c-pending">0</span></button>
      <button class="sb-btn"        id="f-completed" onclick="setFilter('completed')"> ✅ Completed      <span class="cnt" id="c-completed">0</span></button>
      <button class="sb-btn"        id="f-high"      onclick="setFilter('high')">      🔴 High Priority  <span class="cnt" id="c-high">0</span></button>

      <hr class="sb-divider"/>

      <div class="sb-label">Statistics</div>
      <div class="stat-row"><span>Total Tasks</span>   <span class="stat-val" id="s-total">0</span></div>
      <div class="stat-row"><span>Pending</span>       <span class="stat-val" id="s-pending">0</span></div>
      <div class="stat-row"><span>Completed</span>     <span class="stat-val" id="s-comp">0</span></div>
      <div class="stat-row"><span>High Priority</span> <span class="stat-val" id="s-high">0</span></div>

      <div class="prog-wrap">
        <div class="prog-label">Progress</div>
        <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="prog-pct" id="prog-pct">0%</div>
      </div>
    </aside>

    <!-- Main panel -->
    <main class="main-panel">
      <div class="panel-head">
        <h2>Your Tasks</h2>
        <span class="badge-count" id="visible-count">0 tasks</span>
      </div>

      <!-- Add task form -->
      <div class="add-form">
        <h3>➕ Add New Task</h3>
        <div class="form-grid">
          <input class="fi" id="t-title"    placeholder="Task title *" onkeydown="if(event.key==='Enter')addTask()"/>
          <select class="fi" id="t-priority">
            <option value="medium">🟡 Medium</option>
            <option value="high">🔴 High</option>
            <option value="low">🟢 Low</option>
          </select>
          <select class="fi" id="t-category">
            <option value="general">📁 General</option>
            <option value="work">💼 Work</option>
            <option value="personal">🏠 Personal</option>
            <option value="health">💪 Health</option>
            <option value="finance">💰 Finance</option>
          </select>
          <input class="fi" id="t-due" type="date"/>
        </div>
        <div class="form-row2">
          <input class="fi" id="t-desc" placeholder="Description (optional)"/>
          <button class="btn-add" id="add-btn" onclick="addTask()">+ Add Task</button>
        </div>
      </div>

      <!-- Task list -->
      <div id="task-list" class="task-list"></div>
    </main>
  </div>
</div>

<!-- Toast container -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- ══════════════════════════════════════════════
     JAVASCRIPT — Full App Logic
══════════════════════════════════════════════ -->
<script>
// ── State ──────────────────────────────────────────────────
let currentUser = null;   // { id, name, email }
let tasks       = [];     // array of task objects
let filter      = 'all';
let isRegister  = false;
let taskIdSeq   = 1;

// ── Storage helpers (simulates a database using localStorage) ──
const DB = {
  getUsers  : ()  => JSON.parse(localStorage.getItem('tm_users')  || '[]'),
  saveUsers : (u) => localStorage.setItem('tm_users',  JSON.stringify(u)),
  getTasks  : ()  => JSON.parse(localStorage.getItem('tm_tasks')  || '[]'),
  saveTasks : (t) => localStorage.setItem('tm_tasks',  JSON.stringify(t)),
  getSeq    : ()  => parseInt(localStorage.getItem('tm_seq') || '1'),
  saveSeq   : (n) => localStorage.setItem('tm_seq', String(n)),
  getSession: ()  => JSON.parse(localStorage.getItem('tm_session') || 'null'),
  saveSession: (u)=> localStorage.setItem('tm_session', JSON.stringify(u)),
  clearSession:()  => localStorage.removeItem('tm_session'),
};

// ── Simple hash (not cryptographic — use bcrypt on a real backend) ──
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return 'h_' + Math.abs(hash).toString(36);
}

// ══════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════
function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('auth-icon').textContent  = isRegister ? '✨' : '📋';
  document.getElementById('auth-title').textContent = isRegister ? 'Create Account' : 'Welcome Back';
  document.getElementById('auth-sub').textContent   = isRegister ? 'Start managing tasks today' : 'Sign in to your task manager';
  document.getElementById('auth-btn').textContent   = isRegister ? '🚀 Create Account' : '🔓 Login';
  document.getElementById('switch-txt').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
  document.querySelector('.auth-switch button').textContent = isRegister ? 'Login here' : 'Register here';
  document.getElementById('field-name').style.display = isRegister ? 'block' : 'none';
  showAuthErr('');
}

function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg ? '⚠️ ' + msg : '';
  el.classList.toggle('show', !!msg);
}

function submitAuth() {
  const name  = document.getElementById('inp-name').value.trim();
  const email = document.getElementById('inp-email').value.trim().toLowerCase();
  const pass  = document.getElementById('inp-pass').value;

  // Client-side validation
  if (isRegister && !name)          return showAuthErr('Please enter your full name.');
  if (!email || !email.includes('@')) return showAuthErr('Please enter a valid email address.');
  if (pass.length < 6)              return showAuthErr('Password must be at least 6 characters.');

  const btn = document.getElementById('auth-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Please wait…';

  // Simulate async (like a real API call)
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = isRegister ? '🚀 Create Account' : '🔓 Login';

    if (isRegister) {
      doRegister(name, email, pass);
    } else {
      doLogin(email, pass);
    }
  }, 400);
}

function doRegister(name, email, pass) {
  const users = DB.getUsers();
  if (users.find(u => u.email === email))
    return showAuthErr('An account with that email already exists.');

  const seq = DB.getSeq();
  const user = { id: seq, name, email, password: simpleHash(pass), createdAt: new Date().toISOString() };
  users.push(user);
  DB.saveUsers(users);
  DB.saveSeq(seq + 1);

  loginUser({ id: user.id, name: user.name, email: user.email });
  toast('🎉 Account created successfully!', 'success');
}

function doLogin(email, pass) {
  const users = DB.getUsers();
  const user  = users.find(u => u.email === email);
  if (!user || user.password !== simpleHash(pass))
    return showAuthErr('Invalid email or password. Please try again.');

  loginUser({ id: user.id, name: user.name, email: user.email });
  toast('👋 Welcome back, ' + user.name + '!', 'success');
}

function loginUser(user) {
  currentUser = user;
  DB.saveSession(user);

  // Load this user's tasks
  taskIdSeq = DB.getSeq();
  tasks = DB.getTasks().filter(t => t.userId === user.id);

  // Populate header
  const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('user-name').textContent   = user.name;
  document.getElementById('user-email').textContent  = user.email;

  showPage('app');
  renderAll();
}

function logout() {
  DB.clearSession();
  currentUser = null;
  tasks = [];
  filter = 'all';

  // Reset form inputs
  document.getElementById('inp-name').value  = '';
  document.getElementById('inp-email').value = '';
  document.getElementById('inp-pass').value  = '';
  showAuthErr('');
  if (isRegister) toggleMode();  // reset to login mode

  showPage('auth');
  toast('Logged out successfully.', 'info');
}

// ══════════════════════════════════════════════
//  PAGE SWITCHING
// ══════════════════════════════════════════════
function showPage(name) {
  document.getElementById('auth-page').classList.toggle('active', name === 'auth');
  document.getElementById('app-page').classList.toggle('active',  name === 'app');
}

// ══════════════════════════════════════════════
//  TASKS — CRUD
// ══════════════════════════════════════════════
function addTask() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) {
    toast('⚠️ Task title is required!', 'error');
    document.getElementById('t-title').focus();
    return;
  }

  const allTasks = DB.getTasks();
  const seq = DB.getSeq();
  const task = {
    id:          seq,
    userId:      currentUser.id,
    title,
    description: document.getElementById('t-desc').value.trim(),
    priority:    document.getElementById('t-priority').value,
    category:    document.getElementById('t-category').value,
    dueDate:     document.getElementById('t-due').value || null,
    completed:   false,
    createdAt:   new Date().toISOString(),
    updatedAt:   new Date().toISOString(),
  };

  allTasks.push(task);
  DB.saveTasks(allTasks);
  DB.saveSeq(seq + 1);
  tasks.unshift(task); // add to front (newest first)

  // Clear form
  document.getElementById('t-title').value    = '';
  document.getElementById('t-desc').value     = '';
  document.getElementById('t-priority').value = 'medium';
  document.getElementById('t-category').value = 'general';
  document.getElementById('t-due').value      = '';

  renderAll();
  toast('✅ Task added!', 'success');
}

function toggleComplete(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.completed = !task.completed;
  task.updatedAt = new Date().toISOString();
  saveCurrentUserTasks();
  renderAll();
  toast(task.completed ? '✅ Marked as done!' : '↩️ Moved back to pending.', 'info');
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveCurrentUserTasks();
  renderAll();
  toast('🗑️ Task deleted.', 'info');
}

function saveCurrentUserTasks() {
  // Replace user's tasks in global store
  const allTasks = DB.getTasks().filter(t => t.userId !== currentUser.id);
  DB.saveTasks([...allTasks, ...tasks]);
}

// ══════════════════════════════════════════════
//  FILTER
// ══════════════════════════════════════════════
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + f).classList.add('active');
  renderTaskList();
}

function getFiltered() {
  if (filter === 'pending')   return tasks.filter(t => !t.completed);
  if (filter === 'completed') return tasks.filter(t =>  t.completed);
  if (filter === 'high')      return tasks.filter(t => t.priority === 'high' && !t.completed);
  return tasks;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderAll() {
  renderCounts();
  renderTaskList();
}

function renderCounts() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.completed).length;
  const pend  = total - done;
  const high  = tasks.filter(t => t.priority === 'high' && !t.completed).length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

  // Sidebar counts
  document.getElementById('c-all').textContent       = total;
  document.getElementById('c-pending').textContent   = pend;
  document.getElementById('c-completed').textContent = done;
  document.getElementById('c-high').textContent      = high;

  // Stats
  document.getElementById('s-total').textContent   = total;
  document.getElementById('s-pending').textContent = pend;
  document.getElementById('s-comp').textContent    = done;
  document.getElementById('s-high').textContent    = high;

  // Progress
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent  = pct + '%';
}

function renderTaskList() {
  const list     = document.getElementById('task-list');
  const visible  = getFiltered();

  document.getElementById('visible-count').textContent =
    visible.length + ' task' + (visible.length !== 1 ? 's' : '');

  if (visible.length === 0) {
    const msgs = {
      all:       { icon:'📭', h:'No tasks yet',          p:'Add your first task above to get started!' },
      pending:   { icon:'🎉', h:'All caught up!',         p:'No pending tasks right now.' },
      completed: { icon:'📭', h:'Nothing completed yet',  p:'Mark a task as done to see it here.' },
      high:      { icon:'✅', h:'No high-priority tasks', p:'All urgent items are handled!' },
    };
    const m = msgs[filter] || msgs.all;
    list.innerHTML = `
      <div class="empty">
        <div class="ei">${m.icon}</div>
        <h3>${m.h}</h3>
        <p>${m.p}</p>
      </div>`;
    return;
  }

  list.innerHTML = visible.map(task => {
    const prioClass = 'p-' + task.priority;
    const doneClass = task.completed ? 'done' : '';
    const checkCls  = task.completed ? 'checked' : '';
    const prioTag   = task.priority === 'high'
      ? '<span class="tag tag-high">🔴 high</span>'
      : task.priority === 'medium'
        ? '<span class="tag tag-medium">🟡 medium</span>'
        : '<span class="tag tag-low">🟢 low</span>';
    const catTag  = `<span class="tag tag-cat">📂 ${task.category}</span>`;
    const dueTag  = task.dueDate ? `<span class="tag tag-due">📅 ${task.dueDate}</span>` : '';
    const doneTag = task.completed ? '<span class="tag tag-done">✅ Done</span>' : '';

    const undoBtn = task.completed
      ? `<button class="act-btn undone" onclick="toggleComplete(${task.id})">↩️ Undo</button>`
      : `<button class="act-btn" onclick="toggleComplete(${task.id})">✅ Done</button>`;

    return `
      <div class="task-card ${prioClass} ${doneClass}">
        <div class="task-check ${checkCls}" onclick="toggleComplete(${task.id})">${task.completed ? '✓' : ''}</div>
        <div class="tc-body">
          <div class="tc-title">${escHtml(task.title)}</div>
          ${task.description ? `<div class="tc-desc">${escHtml(task.description)}</div>` : ''}
          <div class="tc-tags">${prioTag}${catTag}${dueTag}${doneTag}</div>
        </div>
        <div class="tc-actions">
          ${undoBtn}
          <button class="act-btn del" onclick="deleteTask(${task.id})">🗑️ Delete</button>
        </div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
function toast(msg, type = 'info') {
  const wrap = document.getElementById('toast-wrap');
  const el   = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2700);
  setTimeout(() => el.remove(), 3000);
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ══════════════════════════════════════════════
//  INIT — Restore session on page load
// ══════════════════════════════════════════════
window.addEventListener('load', () => {
  const session = DB.getSession();

  if (session) {
    loginUser(session);   // restore logged-in user
  } else {
    showPage('auth');
  }

  // Hide loading screen
  const ls = document.getElementById('loading-screen');
  ls.classList.add('hide');
  setTimeout(() => ls.remove(), 400);
});

// Enter key on auth inputs
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('auth-page').classList.contains('active')) {
      submitAuth();
    }
  }
});
</script>
